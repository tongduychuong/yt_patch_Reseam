name: Build YouTube & YouTube Music (Reseam)

on:
  workflow_dispatch:
    inputs:
      yt_version:
        description: 'Phiên bản YouTube (để trống để tự dò tự động)'
        required: false
        default: ''
        type: string
      ytm_version:
        description: 'Phiên bản YouTube Music (để trống để tự dò tự động)'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Reseam CLI & Patches Bundle
        run: |
          mkdir -p work
          cd work

          # 1. Tải Reseam CLI mới nhất từ reseam/reseam
          CLI_URL=$(curl -s https://api.github.com/repos/reseam/reseam/releases/latest \
            | grep -i "browser_download_url" \
            | grep -iE "linux.*(x64|amd64)|x86_64.*linux" \
            | head -n 1 \
            | cut -d '"' -f 4)
          echo "Downloading CLI: $CLI_URL"
          curl -L "$CLI_URL" -o reseam_pkg
          if file reseam_pkg | grep -q "gzip"; then
            tar -xzf reseam_pkg
          elif file reseam_pkg | grep -q "Zip"; then
            unzip -q reseam_pkg
          else
            mv reseam_pkg reseam
          fi
          RESEAM_BIN=$(find . -type f -name "reseam*" ! -name "*.tar.gz" ! -name "*.zip" | head -n 1)
          chmod +x "$RESEAM_BIN"
          echo "RESEAM_BIN=$(pwd)/${RESEAM_BIN#./}" >> "$GITHUB_ENV"

          # 2. Tải gói patches (.reseam) mới nhất từ Reseam/patches
          BUNDLE_URL=$(curl -s https://api.github.com/repos/Reseam/patches/releases/latest \
            | grep -i "browser_download_url" \
            | grep -i "\.reseam" \
            | head -n 1 \
            | cut -d '"' -f 4)
          echo "Downloading Bundle: $BUNDLE_URL"
          curl -L "$BUNDLE_URL" -o patches.reseam

      - name: Resolve Versions from Reseam
        id: versions
        env:
          INPUT_YT_VER: ${{ github.event.inputs.yt_version }}
          INPUT_YTM_VER: ${{ github.event.inputs.ytm_version }}
        run: |
          python3 scripts/resolve_versions.py \
            --bundle work/patches.reseam \
            --yt-out youtube.txt \
            --ytm-out youtube_music.txt \
            --env-file /tmp/resolved_versions.env
          cat /tmp/resolved_versions.env >> "$GITHUB_ENV"

      - name: Commit Resolved Versions
        run: |
          source /tmp/resolved_versions.env
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add youtube.txt youtube_music.txt

          if git diff --staged --quiet; then
            echo "No version changes to commit."
          else
            git commit -m "chore: update versions YT=${YT_VER}, YTM=${YTM_VER}"
            git push
          fi

      - name: Download Exact Original APKs
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq unzip wget
          cd work

          python3 ../scripts/download_apk.py youtube ../youtube.txt yt_orig.apk
          python3 ../scripts/download_apk.py ytm ../youtube_music.txt ytm_orig.apk

          ls -lh yt_orig.apk ytm_orig.apk

      - name: Patch YouTube & YouTube Music
        env:
          SECRET_TRUST_KEY: ${{ secrets.RESEAM_TRUST_KEY }}
        run: |
          cd work
          source /tmp/resolved_versions.env

          TRUST_KEY="${SECRET_TRUST_KEY:-556c1b22f4e03398212ba10fe6a31db252df49f599b938d24a9f2b6baec41a1d}"

          "$RESEAM_BIN" patch yt_orig.apk \
            --bundle patches.reseam \
            --trust "$TRUST_KEY" \
            --output "youtube-reseam-${YT_VER}.apk"

          "$RESEAM_BIN" patch ytm_orig.apk \
            --bundle patches.reseam \
            --trust "$TRUST_KEY" \
            --output "youtube-music-reseam-${YTM_VER}.apk"

      - name: Generate Changelog
        run: |
          source /tmp/resolved_versions.env

          CLI_TAG=$(curl -s https://api.github.com/repos/reseam/reseam/releases/latest \
            | grep -i '"tag_name"' \
            | head -n 1 \
            | cut -d '"' -f 4)
          CLI_TAG="${CLI_TAG:-latest}"

          PATCHES_TAG=$(curl -s https://api.github.com/repos/Reseam/patches/releases/latest \
            | grep -i '"tag_name"' \
            | head -n 1 \
            | cut -d '"' -f 4)
          PATCHES_TAG="${PATCHES_TAG:-latest}"

          cat <<EOF > CHANGELOG.md
          # Reseam Build #${{ github.run_number }}

          - **YouTube version:** \`${YT_VER}\`
          - **YouTube Music version:** \`${YTM_VER}\`
          - **Reseam CLI (\`reseam/reseam\`):** \`${CLI_TAG}\`
          - **Reseam Patches (\`Reseam/patches\`):** \`${PATCHES_TAG}\`
          - **Commit:** \`${{ github.sha }}\`
          EOF
          cat CHANGELOG.md

      - name: Create Release & Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Reseam Build #${{ github.run_number }} (YT ${{ env.YT_VER }})"
          body_path: CHANGELOG.md
          files: |
            CHANGELOG.md
            work/youtube-reseam-${{ env.YT_VER }}.apk
            work/youtube-music-reseam-${{ env.YTM_VER }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
