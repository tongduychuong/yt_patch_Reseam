name: Build YouTube & YouTube Music (Reseam)

on:
  workflow_dispatch:
    inputs:
      yt_version:
        description: 'Phiên bản YouTube (để trống để tự dò tự động)'
        required: false
        default: ''
        type: string
      ytm_version:
        description: 'Phiên bản YouTube Music (để trống để tự dò tự động)'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Reseam CLI & Patches Bundle
        run: |
          mkdir -p work
          cd work

          # 1. Tải Reseam CLI mới nhất từ Reseam/reseam
          CLI_URL=$(curl -s https://api.github.com/repos/Reseam/reseam/releases/latest \
            | grep -i "browser_download_url" \
            | grep -iE "linux.*(x64|amd64)|x86_64.*linux" \
            | head -n 1 \
            | cut -d '"' -f 4)
          echo "Downloading CLI: $CLI_URL"
          curl -L "$CLI_URL" -o reseam_pkg
          if file reseam_pkg | grep -q "gzip"; then
            tar -xzf reseam_pkg
          elif file reseam_pkg | grep -q "Zip"; then
            unzip -q reseam_pkg
          else
            mv reseam_pkg reseam
          fi
          RESEAM_BIN=$(find . -type f -name "reseam*" ! -name "*.tar.gz" ! -name "*.zip" | head -n 1)
          chmod +x "$RESEAM_BIN"
          echo "RESEAM_BIN=$(pwd)/${RESEAM_BIN#./}" >> "$GITHUB_ENV"

          # 2. Tải gói patches (.reseam) mới nhất từ Reseam/patches
          BUNDLE_URL=$(curl -s https://api.github.com/repos/Reseam/patches/releases/latest \
            | grep -i "browser_download_url" \
            | grep -i "\.reseam" \
            | head -n 1 \
            | cut -d '"' -f 4)
          echo "Downloading Bundle: $BUNDLE_URL"
          curl -L "$BUNDLE_URL" -o patches.reseam

      - name: Resolve Versions from Reseam
        id: versions
        env:
          INPUT_YT_VER: ${{ github.event.inputs.yt_version }}
          INPUT_YTM_VER: ${{ github.event.inputs.ytm_version }}
        run: |
          cd work
          python3 - <<'EOF'
          import json, os, re, zipfile

          yt_ver = os.environ.get("INPUT_YT_VER", "").strip()
          ytm_ver = os.environ.get("INPUT_YTM_VER", "").strip()

          # Ràng buộc dải phiên bản thực tế để loại bỏ số build/ID lạc vào
          YT_PATTERN = re.compile(r'^(1[89]|2[0-3])\.\d+\.\d+$')
          YTM_PATTERN = re.compile(r'^([6-9]|1[0-2])\.\d+\.\d+$')

          def ver_key(v: str):
              return [int(x) for x in v.split(".")]

          def collect_versions_from_obj(obj, target_pkg: str, found: set):
              if isinstance(obj, dict):
                  pkg_val = str(obj.get("name") or obj.get("packageName") or "")
                  if pkg_val == target_pkg and isinstance(obj.get("versions"), list):
                      for v in obj["versions"]:
                          if isinstance(v, str):
                              found.add(v.strip())
                  for val in obj.values():
                      collect_versions_from_obj(val, target_pkg, found)
              elif isinstance(obj, list):
                  for item in obj:
                      collect_versions_from_obj(item, target_pkg, found)

          yt_candidates = set()
          ytm_candidates = set()

          if not yt_ver or not ytm_ver:
              try:
                  with zipfile.ZipFile("patches.reseam", "r") as zf:
                      for name in zf.namelist():
                          if name.lower().endswith(".json"):
                              raw = zf.read(name).decode("utf-8", errors="ignore")
                              try:
                                  data = json.loads(raw)
                                  if not yt_ver:
                                      collect_versions_from_obj(data, "com.google.android.youtube", yt_candidates)
                                  if not ytm_ver:
                                      collect_versions_from_obj(data, "com.google.android.apps.youtube.music", ytm_candidates)
                              except json.JSONDecodeError:
                                  continue
              except Exception as e:
                  print("Zip inspection error:", e)

          valid_yt = [v for v in yt_candidates if YT_PATTERN.match(v)]
          valid_ytm = [v for v in ytm_candidates if YTM_PATTERN.match(v)]

          print("YT candidates:", sorted(valid_yt, key=ver_key))
          print("YTM candidates:", sorted(valid_ytm, key=ver_key))

          if not yt_ver and valid_yt:
              yt_ver = sorted(valid_yt, key=ver_key)[-1]
          if not ytm_ver and valid_ytm:
              ytm_ver = sorted(valid_ytm, key=ver_key)[-1]

          # Giá trị dự phòng chuẩn nếu không đọc được từ JSON
          yt_ver = yt_ver or "21.37.42"
          ytm_ver = ytm_ver or "9.40.51"

          print(f"Resolved YouTube version: {yt_ver}")
          print(f"Resolved YouTube Music version: {ytm_ver}")

          with open("/tmp/resolved_versions.env", "w") as f:
              f.write(f"YT_VER={yt_ver}\n")
              f.write(f"YTM_VER={ytm_ver}\n")
          EOF
          cat /tmp/resolved_versions.env >> "$GITHUB_ENV"

      - name: Download Exact Original APKs
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq unzip wget
          cd work

          python3 ../scripts/download_apk.py youtube "$YT_VER" yt_orig.apk
          python3 ../scripts/download_apk.py ytm "$YTM_VER" ytm_orig.apk

          ls -lh yt_orig.apk ytm_orig.apk

      - name: Patch YouTube & YouTube Music
        run: |
          cd work

          "$RESEAM_BIN" patch yt_orig.apk \
            --bundle patches.reseam \
            --trust \
            --output "youtube-reseam-${YT_VER}.apk"

          "$RESEAM_BIN" patch ytm_orig.apk \
            --bundle patches.reseam \
            --trust \
            --output "youtube-music-reseam-${YTM_VER}.apk"

      - name: Create Release & Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Reseam Build #${{ github.run_number }} (YT ${{ env.YT_VER }})"
          files: |
            work/youtube-reseam-${{ env.YT_VER }}.apk
            work/youtube-music-reseam-${{ env.YTM_VER }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
