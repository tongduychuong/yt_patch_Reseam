name: Build YouTube & YouTube Music (Reseam)

on:
  workflow_dispatch:
    inputs:
      yt_version:
        description: 'Phiên bản YouTube (để trống để tự dò tự động)'
        required: false
        default: ''
        type: string
      ytm_version:
        description: 'Phiên bản YouTube Music (để trống để tự dò tự động)'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Reseam CLI & Patches Bundle
        run: |
          mkdir -p work
          cd work

          # 1. Tải Reseam CLI mới nhất từ Reseam/reseam
          CLI_URL=$(curl -s https://api.github.com/repos/Reseam/reseam/releases/latest \
            | grep -i "browser_download_url" \
            | grep -iE "linux.*(x64|amd64)|x86_64.*linux" \
            | head -n 1 \
            | cut -d '"' -f 4)
          echo "Downloading CLI: $CLI_URL"
          curl -L "$CLI_URL" -o reseam_pkg
          if file reseam_pkg | grep -q "gzip"; then
            tar -xzf reseam_pkg
          elif file reseam_pkg | grep -q "Zip"; then
            unzip -q reseam_pkg
          else
            mv reseam_pkg reseam
          fi
          RESEAM_BIN=$(find . -type f -name "reseam*" ! -name "*.tar.gz" ! -name "*.zip" | head -n 1)
          chmod +x "$RESEAM_BIN"
          echo "RESEAM_BIN=$(pwd)/${RESEAM_BIN#./}" >> "$GITHUB_ENV"

          # 2. Tải gói patches (.reseam) mới nhất từ Reseam/patches
          BUNDLE_URL=$(curl -s https://api.github.com/repos/Reseam/patches/releases/latest \
            | grep -i "browser_download_url" \
            | grep -i "\.reseam" \
            | head -n 1 \
            | cut -d '"' -f 4)
          echo "Downloading Bundle: $BUNDLE_URL"
          curl -L "$BUNDLE_URL" -o patches.reseam

      - name: Resolve Versions from Reseam
        id: versions
        env:
          INPUT_YT_VER: ${{ github.event.inputs.yt_version }}
          INPUT_YTM_VER: ${{ github.event.inputs.ytm_version }}
        run: |
          cd work
          python3 - <<'EOF'
          import os, re, zipfile, urllib.request

          yt_ver = os.environ.get("INPUT_YT_VER", "").strip()
          ytm_ver = os.environ.get("INPUT_YTM_VER", "").strip()

          # 1. Dò phiên bản bên trong gói patches.reseam
          if not yt_ver or not ytm_ver:
              try:
                  with zipfile.ZipFile("patches.reseam", "r") as zf:
                      for name in zf.namelist():
                          if name.endswith(".json"):
                              data = zf.read(name).decode("utf-8", errors="ignore")
                              if not ytm_ver and ("com.google.android.youtube.music" in data or "youtube.music" in data):
                                  m_ytm = re.findall(r'\b([89]\.\d+\.\d+|1\d\.\d+\.\d+)\b', data)
                                  if m_ytm:
                                      ytm_ver = sorted(set(m_ytm), key=lambda s: [int(x) for x in s.split(".")])[-1]
                              if not yt_ver and "com.google.android.youtube" in data:
                                  m_yt = re.findall(r'\b(2[0-9]\.\d+\.\d+)\b', data)
                                  if m_yt:
                                      yt_ver = sorted(set(m_yt), key=lambda s: [int(x) for x in s.split(".")])[-1]
              except Exception as e:
                  print("Zip inspection note:", e)

          # 2. Dò bổ sung từ trang https://reseam.app/vi/patches/ nếu còn thiếu
          if not yt_ver or not ytm_ver:
              try:
                  req = urllib.request.Request(
                      "https://reseam.app/vi/patches/",
                      headers={"User-Agent": "Mozilla/5.0"}
                  )
                  html = urllib.request.urlopen(req, timeout=15).read().decode("utf-8", errors="ignore")
                  if not yt_ver:
                      m_yt = re.findall(r'\b(2[0-9]\.\d+\.\d+)\b', html)
                      if m_yt:
                          yt_ver = sorted(set(m_yt), key=lambda s: [int(x) for x in s.split(".")])[-1]
                  if not ytm_ver:
                      m_ytm = re.findall(r'\b([89]\.\d+\.\d+|1\d\.\d+\.\d+)\b', html)
                      if m_ytm:
                          ytm_ver = sorted(set(m_ytm), key=lambda s: [int(x) for x in s.split(".")])[-1]
              except Exception as e:
                  print("Web fetch note:", e)

          # 3. Giá trị dự phòng khi không tự dò ra
          yt_ver = yt_ver or "21.37.42"
          ytm_ver = ytm_ver or "9.40.51"

          print(f"Resolved YouTube version: {yt_ver}")
          print(f"Resolved YouTube Music version: {ytm_ver}")

          with open("/tmp/resolved_versions.env", "w") as f:
              f.write(f"YT_VER={yt_ver}\n")
              f.write(f"YTM_VER={ytm_ver}\n")
          EOF
          cat /tmp/resolved_versions.env >> "$GITHUB_ENV"

      - name: Download Exact Original APKs
        run: |
          cd work
          wget -q https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu -O apkeep
          chmod +x apkeep

          echo "Tải YouTube bản: $YT_VER"
          ./apkeep -a "com.google.android.youtube@${YT_VER}" .

          echo "Tải YouTube Music bản: $YTM_VER"
          ./apkeep -a "com.google.android.apps.youtube.music@${YTM_VER}" .

          ls -lh *.apk

      - name: Patch YouTube & YouTube Music
        run: |
          cd work
          YT_APK=$(ls com.google.android.youtube*.apk | head -n 1)
          YTM_APK=$(ls com.google.android.apps.youtube.music*.apk | head -n 1)

          "$RESEAM_BIN" patch "$YT_APK" \
            --bundle patches.reseam \
            --trust \
            --output "youtube-reseam-${YT_VER}.apk"

          "$RESEAM_BIN" patch "$YTM_APK" \
            --bundle patches.reseam \
            --trust \
            --output "youtube-music-reseam-${YTM_VER}.apk"

      - name: Create Release & Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Reseam Build #${{ github.run_number }} (YT ${{ env.YT_VER }})"
          files: |
            work/youtube-reseam-${{ env.YT_VER }}.apk
            work/youtube-music-reseam-${{ env.YTM_VER }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
